<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 検索エンジンにインデックスさせない（robots.txt と対で効かせる）。
     元データはPDF中心で氏名検索に引っかかりにくいが、このサイトはHTMLなので
     そのままだと選手名・審判名が検索結果に出る。URLを知っていれば見られる状態は変わらない。 -->
<meta name="robots" content="noindex, nofollow">
<title>リザルト | トランポリン大会リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <!-- 入口は検索。いきなり8,175件の表は出さない -->
  <div class="card hero">
    <label class="hero-search">
      <span class="hero-label">選手・所属・大会をさがす</span>
      <input type="search" id="q" autocomplete="off"
             placeholder="選手名・所属・大会名を検索　例：城 瑛斗">
    </label>
    <div id="suggest" class="suggest" hidden></div>
    <div class="hero-actions">
      <button class="chip" id="toggle-filters" aria-expanded="false">詳しく絞り込む ▼</button>
      <button class="chip" id="show-all">すべての記録を見る</button>
      <button class="chip" id="reset" hidden>条件をクリア</button>
      <button class="chip" id="csv" hidden>CSVで書き出す</button>
    </div>
    <div class="controls" id="filters" hidden>
      <label>年<select id="f-year"></select></label>
      <label>大会<select id="f-meet"></select></label>
      <label>区分<select id="f-category"></select></label>
      <label>ラウンド<select id="f-round"></select></label>
      <label>演技<select id="f-routine"></select></label>
    </div>
    <div id="note-slot"></div>
  </div>

  <!-- 初期表示：最近の大会。ここから入る -->
  <div class="card" id="recent-card">
    <h2>最近の大会</h2>
    <p class="meta">大会を選ぶと、その大会の記録を表示します。</p>
    <div id="recent" class="meet-grid"></div>
  </div>

  <div class="card" id="results-card" hidden>
    <div class="results-head">
      <h2 id="results-title">検索結果</h2>
      <div class="pager" id="pager-top"></div>
    </div>
    <div id="results"></div>
    <div class="pager pager-bottom" id="pager-bottom"></div>
  </div>
</main>
<script type="module" src="js/index.js"></script>
</body>
</html>
