<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大会リザルト | トランポリン大会リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card">
    <p class="meta"><a href="index.html">← リザルト</a></p>
    <div id="meet-head"></div>
    <div id="note-slot"></div>
  </div>

  <div class="card" id="picker-card">
    <h2>区分とラウンドを選ぶ</h2>
    <div id="rounds" class="round-tabs"></div>
    <div id="categories" class="cat-grid"></div>
  </div>

  <div class="card" id="result-card" hidden>
    <div class="results-head">
      <h2 id="result-title">結果</h2>
      <button class="chip" id="csv">CSVで書き出す</button>
    </div>
    <p class="meta" id="result-note"></p>
    <div id="result"></div>
  </div>
</main>
<script type="module" src="js/meet.js"></script>
</body>
</html>
