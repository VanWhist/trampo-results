<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 検索エンジンにインデックスさせない（robots.txt と対で効かせる）。
     元データはPDF中心で氏名検索に引っかかりにくいが、このサイトはHTMLなので
     そのままだと選手名・審判名が検索結果に出る。URLを知っていれば見られる状態は変わらない。 -->
<meta name="robots" content="noindex, nofollow">
<title>選手 | トランポリン大会リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card" id="search-card">
    <h2>選手を探す</h2>
    <div class="controls">
      <label>選手名（部分一致）
        <input type="search" id="q" placeholder="例：瑛斗">
      </label>
    </div>
    <div id="results"></div>
  </div>

  <div class="card" id="athlete-card" hidden>
    <p class="meta"><a href="athlete.html">← 選手を探す</a></p>
    <div id="profile"></div>
    <button class="primary" id="csv" hidden>CSVで書き出す</button>
  </div>

  <div class="card" id="history" hidden></div>
</main>
<script type="module" src="js/athlete.js"></script>
</body>
</html>
