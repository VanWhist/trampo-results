<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 検索エンジンにインデックスさせない（robots.txt と対で効かせる）。
     元データはPDF中心で氏名検索に引っかかりにくいが、このサイトはHTMLなので
     そのままだと選手名・審判名が検索結果に出る。URLを知っていれば見られる状態は変わらない。 -->
<meta name="robots" content="noindex, nofollow">
<title>ジャッジ分析 | トランポリン大会リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card">
    <h2>ジャッジ分析（審判別採点分布）</h2>
    <div id="note-slot"></div>

    <!-- 入口。表をそのまま出さない。ただし「低め◯名」を主役にもしない（順位づけの画面にしないため） -->
    <div class="summary-cards" id="summary"></div>

    <div class="hero-actions" id="quick"></div>

    <label class="hero-search compact">
      <span class="hero-label">審判をさがす</span>
      <input type="search" id="jq" autocomplete="off" placeholder="審判名で検索">
    </label>

    <div class="hero-actions">
      <button class="chip" id="toggle-filters" aria-expanded="false">条件を変える ▼</button>
      <button class="chip" id="reset" hidden>絞り込みをクリア</button>
      <button class="chip" id="csv">CSVで書き出す</button>
    </div>
    <div class="controls" id="filters" hidden>
      <label>母集団<select id="pop"></select></label>
      <label>大会<select id="f-meet"></select></label>
      <label>区分<select id="f-category"></select></label>
      <label>男女<select id="f-sex"></select></label>
      <label>ラウンド<select id="f-round"></select></label>
    </div>
    <p class="meta"><strong id="condition">—</strong></p>
    <p class="meta" id="condition-note"></p>
  </div>

  <div class="card">
    <div class="results-head">
      <h2 id="list-title">審判一覧</h2>
      <div class="pager" id="pager-top"></div>
    </div>
    <div id="judges"></div>
    <div class="pager pager-bottom" id="pager-bottom"></div>
  </div>

  <div class="card">
    <h2>審判データが無い大会</h2>
    <div id="coverage"></div>
  </div>
</main>
<script type="module" src="js/judges.js"></script>
</body>
</html>
